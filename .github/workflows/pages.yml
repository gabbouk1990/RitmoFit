name: Pubblica Ritmo Fit

on:
  push:
    branches: [main]
    paths:
      - 'ritmo-fit-pronto-per-pubblicazione.zip'
      - '.github/workflows/pages.yml'
      - 'overrides/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Estrai i file del sito
        run: |
          mkdir -p _site
          unzip -q ritmo-fit-pronto-per-pubblicazione.zip -d _site
          test -f _site/index.html
          test -f _site/app.js
          test -f _site/style.css
          touch _site/.nojekyll

      - name: Aggiorna turni e schede allenamenti
        run: |
          python3 overrides/patch.py
          python3 overrides/patch_workouts.py
          python3 overrides/patch_food.py
          python3 overrides/patch_interactive.py
          python3 overrides/patch_session_delete.py
          python3 overrides/patch_theme.py
          python3 overrides/patch_history_mobile.py
          python3 overrides/patch_training_experience.py
          python3 overrides/patch_exercise_images.py
          python3 overrides/patch_muscle_visuals.py
          python3 overrides/patch_third_pass.py
          python3 overrides/patch_fourth_pass.py
          python3 overrides/patch_food_latest.py
          python3 overrides/patch_shift_mp_ferie.py
          python3 overrides/patch_secure_calendar_2026.py
          node --check _site/app.js
          node --check _site/ics.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('_site/app.js').read_text()
          assert "Piscina B · aerobico variato" in s
          assert "Hybrid B · forza + conditioning" in s
          assert "migrateTrainingProgram()" in s
          assert "restoreTrainingProgram()" in s
          assert "data-act=\"restoreProgram\"" in s
          assert "training-program.js.txt" not in s
          assert "const FOOD_CATALOG_ROWS=" in s
          assert "function foodIngredientEditorRow" in s
          assert "function editFoodLog" in s
          assert "case 'foodCategory'" in s
          assert "upgradeDefaultMeals()" in s
          assert "nutrition-disclaimer" in s
          assert "food-ingredient-row" in s
          assert 'ritmo-fit-static-v16' in Path('_site/sw.js').read_text()
          assert 'function renderTrainingTimer()' in s
          assert 'function foodPlanCardV2' in s
          assert 'food-live-select' in s
          assert 'function trainingAlternatives' in s
          assert 'case \'foodCategory\'' in s
          assert "await restoreWorkoutRunner();state.hiddenHealthWorkouts=await getItem('hiddenHealthWorkouts',[]);" in s
          assert 'Esplora ${FOOD_CATALOG.length} alimenti' in s
          print("Timer, sostituzioni e catalogo alimentare: verifiche statiche superate")
          assert "function workoutSessionAction(s)" in s
          assert "case 'deleteWorkoutSession'" in s
          assert 'session-inline-actions' in s
          assert 'state.sessions=previous.filter(s=>s.id!==id)' in s
          print("Rimozione singolo allenamento manuale: verificata")
          assert "document.body.dataset.tab=state.tab" in s
          css=Path("_site/style.css").read_text()
          assert "body[data-tab=\"allenamenti\"]" in css
          assert "body[data-tab=\"alimentazione\"]" in css
          assert "--rf-bg" in css
          print("Nuovo tema scuro e sfondi dedicati: verificati")

          assert "function workoutSessionKey(s)" in s
          assert "data-act=\"hideHealthWorkout\"" in s
          assert "data-act=\"deleteWorkoutSession\"" in s
          assert "session-inline-actions" in s
          assert "case 'restoreHiddenHealth'" in s
          assert "function renderWorkouts(){const fromH=(state.health?.workouts||[]).filter" in s
          assert "workout-history-table" in s
          assert 'workout-history-table tbody tr' in css
          print("Azioni visibili e storico responsive: verificati")
          assert "function renderTrainingTimerPro()" in s
          assert "function renderWorkoutStatsPro()" in s
          assert "function proCompleteSet()" in s
          assert "function proSessionFinish()" in s
          assert "data-act=\"proSessionDetails\"" in s
          assert "data-act=\"proAdjustReps\"" in s
          assert "data-act=\"proAdjustLoad\"" in s
          assert "data-to=\"statistiche\"" in s
          assert "pro-timer-ring" in css
          print("Nuove funzioni Allenamenti e grafica: verificati")
          assert 'function proImageSlug(name)' in s
          assert 'proExerciseIllustration(x,2' in s
          assert 'PRO_EXERCISE_IMAGE_CREDITS' in s
          assert 'pro-illustration-slot' in css
          print("Miniature e dettagli illustrati: verificati")
          assert "function proMuscleKey(ex)" in s
          assert "proMuscleDetails(x)" in s
          assert "pro-muscle-mini" in css
          assert "pro-muscle-panel" in css
          print("Mappe muscolari evidenziate: layout verificato")
          assert 'function thirdExerciseHistory(ex)' in s
          assert 'function thirdVolumeBySession(session)' in s
          assert "data-act=\"thirdResume\"" in s
          assert "data-act=\"proCompleteSet\"" in s
          assert 'id=\"thirdRpe\"' in s
          assert 'class=\"third-mobile-dock\"' in s
          assert '.third-mobile-dock' in css
          assert '.third-history-panel' in css
          assert 'ritmo-fit-static-v16' in Path('_site/sw.js').read_text()
          print("Terza passata Allenamenti: controlli statici superati")
          assert 'function rf4ActivityScreen()' in s
          assert 'function rf4ProgramsScreen()' in s
          assert 'function rf4TemplateScreen()' in s
          assert 'function rf4ExerciseScreen()' in s
          assert "data-act=\"rf4Category\"" in s
          assert "data-act=\"rf4OpenTemplate\"" in s
          assert "data-act=\"rf4OpenExercise\"" in s
          assert "data-act=\"rf4StatsRange\"" in s
          assert "data-act=\"rf4TimerFocus\"" in s
          assert "renderWorkoutCardsPro=function()" in s
          assert "renderTrainingTimerPro=function()" in s
          assert ".rf4-category-list" in css
          assert ".rf4-template-row" in css
          assert ".rf4-exercise-hero-art" in css
          assert ".rf4-period-tabs" in css
          assert "ritmo-fit-static-v15" in Path('_site/sw.js').read_text()
          print("Quarta passata mobile dark: UI, viste e timer verificati")
          assert 'const RF_FOOD_LATEST_IDS=' in s
          assert "'tonno-affumicato-bernardini'" in s
          assert "'salmone-aff-in'" in s
          assert "'patate-precotte-tesori'" in s
          assert "'cavolo-cappuccio'" in s
          assert 'data-to="recenti"' in s
          assert "active==='recenti'" in s
          assert 'nutrition-recent-tab' in css
          assert 'nutrition-new-badge' in css
          assert 'ritmo-fit-static-v16' in Path('_site/sw.js').read_text()
          print("Ultime 12 aggiunte alimentari: controlli statici superati")
          assert 'case \'saveManualShift\':' in s
          assert 'case \'removeManualShift\':' in s
          assert "if(s?.type==='MP')return" in s
          assert "if(s?.type==='Ferie')return" in s
          assert "e.source==='manual'" in s
          assert 'data-act="saveManualShift"' in s
          assert 'data-act="removeManualShift"' in s
          assert 'MP · 06:50–21:22' in s
          assert 'F · Ferie' in s
          assert '.calendar-tag.MP' in css
          assert '.calendar-tag.Ferie' in css
          assert 'ritmo-fit-static-v16' in Path('_site/sw.js').read_text()
          print("Turni MP/F, editor giornaliero e riposo: verifiche statiche superate")
          assert "case 'secure2026Import':secure2026ImportDialog()" in s
          assert "async function secure2026Decrypt(code)" in s
          assert "async function secure2026ImportDialog()" not in s
          assert "function secure2026ImportDialog()" in s
          assert 'data-act="secure2026Import"' in s
          assert "SECURE_2026_CODES" in s
          assert "source==='manual'" in s
          encrypted=Path('_site/assets/secure/supershift-2026.enc.json').read_text()
          assert '"AES-256-GCM"' in encrypted and '"nonce"' in encrypted
          assert "secure-supershift-2026-" in s
          assert "ritmo-fit-static-v16" in Path('_site/sw.js').read_text()
          print("Calendario 2026 cifrato e import locale: controlli statici superati")
          PY

      - name: Verifica riconoscimento MP e ferie da Supershift
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const code=readFileSync('_site/ics.js','utf8');
          const {classifyShift,parseICS}=await import('data:text/javascript;charset=utf-8,'+encodeURIComponent(code));
          const cases={'MP':'MP','Turno MP':'MP','M/P':'MP','M+P':'MP','Mattina e Pomeriggio':'MP','06.50-21.22':'MP','F':'Ferie','Turno F':'Ferie','Ferie':'Ferie','M':'Mattina','P':'Pomeriggio','N':'Notte','Smonto':'Smonto','Riposo':'Riposo'};
          for(const [label,expected] of Object.entries(cases))assert.equal(classifyShift(label),expected,label);
          const sample='BEGIN:VCALENDAR\nBEGIN:VEVENT\nUID:mp1\nDTSTART;VALUE=DATE:20261021\nDTEND;VALUE=DATE:20261022\nSUMMARY:MP\nEND:VEVENT\nBEGIN:VEVENT\nUID:f1\nDTSTART;VALUE=DATE:20261022\nDTEND;VALUE=DATE:20261023\nSUMMARY:F\nEND:VEVENT\nEND:VCALENDAR';
          assert.deepEqual(parseICS(sample).map(e=>e.type),['MP','Ferie']);
          console.log('MP, F e rotazione tradizionale: classificazione OK');
          JS

      - name: Scarica immagini esercizi con licenza CC BY-SA
        run: |
          python3 overrides/download_exercise_images.py
          test -f _site/assets/exercises/squat-1.png
          test -f _site/assets/exercises/romanian-deadlift-2.png
          test -f _site/assets/exercises/swimming-1.png
          test -f _site/assets/exercises/ATTRIBUTION.txt

      - name: Genera mappe anatomiche evidenziate (offline in Pages)
        run: |
          python3 overrides/build_muscle_maps.py
          test -f _site/assets/muscles/squat.svg
          test -f _site/assets/muscles/chest.svg
          test -f _site/assets/muscles/row.svg
          test -f _site/assets/muscles/swimming.svg
          test -f _site/assets/muscles/LICENSE.txt

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Carica il sito
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Pubblica il sito
        id: deployment
        uses: actions/deploy-pages@v4
